    }

    }

    .project-number {

      color: #666;
    }

    /* =========================
       INSTAGRAM-STYLE CAROUSEL
    ========================= */

    .carousel {
      position: relative;
      width: 100%;
    }

    .carousel-window {
      width: 100%;
      height: min(75vh, 800px);

      display: flex;
      align-items: center;
      justify-content: center;

      background: #e8e8e8;
      overflow: hidden;
    }

    .slide {
      width: 100%;
      height: 100%;

      display: none;
      align-items: center;
      justify-content: center;
    }

    .slide.active {
      display: flex;
    }

   

    /*
      IMPORTANT:
      object-fit: contain mantiene le proporzioni
      dell'immagine e impedisce che venga deformata
      o tagliata.
    */

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Placeholder */

    .placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ddd;
      color: #888;
      font-size: 14px;
    }

    /* =========================
       ARROWS
    ========================= */

    .arrow {
      position: absolute;

      top: 50%;
      transform: translateY(-50%);

      width: 42px;
      height: 42px;

      border: none;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.9);
      color: #111;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;

      transition: background 0.2s ease;
    }

    .arrow:hover {
      background: white;
    }

    .arrow.prev {
      left: 15px;
    }

    #ticket{
      height: 40%;


    }
    .footer {
      width: 100%;
      padding: 30px;
      border-top: 1px solid #111;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 14px;
    }

    .footer a {
      color: #111;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .footer {
        padding: 25px 18px;

        flex-direction: column;
        align-items: flex-start;

        gap: 10px;
      }

    }    

    .arrow.next {
      right: 15px;
    }

    /* =========================
       DOTS
    ========================= */

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 15px;
    }

    .dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;
      border: none;

      background: #ccc;
      cursor: pointer;
    }

    .dot.active {

    /* =========================

  <script>

    /*
      CAROUSEL SYSTEM

      Ogni sezione .carousel funziona
      indipendentemente dalle altre.
    */

    document.querySelectorAll("[data-carousel]").forEach((carousel) => {

      const slides = carousel.querySelectorAll(".slide");
      const prevButton = carousel.querySelector(".prev");
      const nextButton = carousel.querySelector(".next");
      const dotsContainer = carousel.querySelector(".dots");

      let currentSlide = 0;


      /* Create dots */

      slides.forEach((slide, index) => {

        const dot = document.createElement("button");

        dot.classList.add("dot");

        if (index === 0) {
          dot.classList.add("active");
        }

        dot.addEventListener("click", () => {
          showSlide(index);
        });

        dotsContainer.appendChild(dot);

      });


      const dots = dotsContainer.querySelectorAll(".dot");


      /* Show slide */

      function showSlide(index) {

        currentSlide = index;

        slides.forEach((slide, i) => {
          slide.classList.toggle(
            "active",
            i === currentSlide
          );
        });

        dots.forEach((dot, i) => {
          dot.classList.toggle(
            "active",
            i === currentSlide
          );
        });

      }


      /* Previous */

      prevButton.addEventListener("click", () => {

        currentSlide--;

        if (currentSlide < 0) {
          currentSlide = slides.length - 1;
        }

        showSlide(currentSlide);

      });


      /* Next */

      nextButton.addEventListener("click", () => {

        currentSlide++;

        if (currentSlide >= slides.length) {
          currentSlide = 0;
        }

        showSlide(currentSlide);

      });


      /* Keyboard navigation */

      carousel.addEventListener("keydown", (event) => {

        if (event.key === "ArrowLeft") {
          prevButton.click();
        }

        if (event.key === "ArrowRight") {
          nextButton.click();
        }

      });

    });

  </script>
